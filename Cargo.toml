[package]
name = "gene-plarform"
version = "1.0.0"
authors = ["Luis Liu <vangork@live.com>"]
edition = "2024"
license = "Apache-2.0"
default-run = "gene-plarform"

[dependencies]
actix-session = { version = "0.11", features = ["redis-session", "redis-pool"] }
actix-web = "4.12.1"
base64 = "0.22.1"
bcrypt = "0.17.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
deadpool-redis = "0.22.0"
derive_more = "2"
diesel = { version = "2.3.10", features = ["64-column-tables", "chrono", "mysql", "r2d2", "serde_json", "time"] }
diesel-async = { version = "0.7.0", features = ["deadpool", "mysql"] }
diesel_migrations = "2.3.2"
dotenv = "0.15"
env_logger = "0.11.8"
futures-util = { version = "0.3.17", default-features = false, features = ["std"] }
log = "0.4"
mysql = "24"
rand = "0.8"
serde = "1"
serde_derive = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.19", features = ["v4"] }

[dev-dependencies]
diesel_migrations = "2.3.0"
