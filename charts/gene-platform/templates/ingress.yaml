apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gene-platform.fullname" . }}
  labels:
    {{- include "gene-platform.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManagerClusterIssuer }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
      - {{ .Values.ingress.host | quote }}
      secretName: {{ include "gene-platform.fullname" . }}-ingress-tls
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "gene-platform.name" $ }}-web-server
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gene-platform.name" $ }}-web-app
                port:
                  number: 80
