apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gene-platform.fullname" . }}-mysql
  labels:
    {{- include "gene-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  selector:
    matchLabels:
      {{- include "gene-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "gene-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: mysql
    spec:
      containers:
      - name: {{ .Chart.Name }}-mysql
        image: "{{ .Values.image.mysql }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
          # Use secret in real usage
        - name: MYSQL_ROOT_PASSWORD
          value: {{ .Values.mysql.rootPassword }}
        - name: MYSQL_DATABASE
          value: {{ .Values.mysql.db }}
        - name: MYSQL_USER
          value: {{ .Values.mysql.user }}
        - name: MYSQL_PASSWORD
          value: {{ .Values.mysql.password }}
        ports:
        - containerPort: 3306
          protocol: TCP
          name: mysql
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
        resources:
          limits:
            cpu: {{ .Values.mysql.cpu }}
            memory: {{ .Values.mysql.memory }}
          requests:
            cpu: {{ .Values.mysql.cpu }}
            memory: {{ .Values.mysql.memory }}
      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: {{ include "gene-platform.fullname" . }}-mysql
