apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "gene-platform.fullname" . }}-mysql
spec:
  capacity:
    storage: {{ .Values.mysql.capacity }}
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ include "gene-platform.fullname" . }}-local-storage
  local:
    path: {{ .Values.mysql.path }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - {{ .Values.mysql.nodeAffinity }}
