apiVersion: v1
kind: Service
metadata:
  name: {{ include "gene-platform.fullname" . }}-mysql
  labels:
    {{- include "gene-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  ports:
  - port: 3306
    protocol: TCP
    targetPort: mysql
  selector:
    {{- include "gene-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
  clusterIP: None
