apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gene-platform.fullname" . }}-postgres
  labels:
    {{- include "gene-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    matchLabels:
      {{- include "gene-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "gene-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
      - name: {{ .Chart.Name }}-postgres
        image: "{{ .Values.image.postgres }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: POSTGRES_DB
          value: {{ .Values.postgres.db | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.postgres.user | quote }}
        # TODO: Use secret
        - name: POSTGRES_PASSWORD
          value: {{ .Values.postgres.password | quote }}
        ports:
        - containerPort: 5432
          protocol: TCP
          name: postgres
        volumeMounts:
        - name: postgres-persistent-storage
          mountPath: /var/lib/postgresql
        resources:
          limits:
            cpu: {{ .Values.postgres.cpu }}
            memory: {{ .Values.postgres.memory }}
          requests:
            cpu: {{ .Values.postgres.cpu }}
            memory: {{ .Values.postgres.memory }}
      volumes:
      - name: postgres-persistent-storage
        persistentVolumeClaim:
          claimName: {{ include "gene-platform.fullname" . }}-postgres
