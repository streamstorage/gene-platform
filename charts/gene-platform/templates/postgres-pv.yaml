apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "gene-platform.fullname" . }}-postgres
spec:
  capacity:
    storage: {{ .Values.postgres.capacity }}
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ include "gene-platform.fullname" . }}-postgres-local-storage
  local:
    path: {{ .Values.postgres.path }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - {{ .Values.postgres.nodeAffinity }}
