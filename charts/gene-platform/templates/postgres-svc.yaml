apiVersion: v1
kind: Service
metadata:
  name: {{ include "gene-platform.fullname" . }}-postgres
  labels:
    {{- include "gene-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  ports:
  - port: 5432
    protocol: TCP
    targetPort: postgres
  selector:
    {{- include "gene-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  clusterIP: None
