apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gene-platform.fullname" . }}-redis
  labels:
    {{- include "gene-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    matchLabels:
      {{- include "gene-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "gene-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
      - name: {{ .Chart.Name }}-redis
        image: "{{ .Values.image.redis }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 6379
          protocol: TCP
          name: redis
        resources:
          limits:
            cpu: {{ .Values.redis.cpu }}
            memory: {{ .Values.redis.memory }}
          requests:
            cpu: {{ .Values.redis.cpu }}
            memory: {{ .Values.redis.memory }}
