apiVersion: v1
kind: Service
metadata:
  name: {{ include "gene-platform.fullname" . }}-redis
  labels:
    {{- include "gene-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  ports:
  - port: 6379
    protocol: TCP
    targetPort: redis
  selector:
    {{- include "gene-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  clusterIP: None
