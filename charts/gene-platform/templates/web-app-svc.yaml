apiVersion: v1
kind: Service
metadata:
  name: {{ include "gene-platform.fullname" . }}-web-app
  labels:
    {{- include "gene-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-app
spec:
  ports:
    - port: 80
      protocol: TCP
      targetPort: http
  selector:
    {{- include "gene-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web-app
  type: ClusterIP
