services:
  postgres:
    container_name: postgres
    image: postgres
    restart: always
    # set shared memory limit
    shm_size: 128mb
    environment:
      POSTGRES_DB: gene
      POSTGRES_USER: gene
      POSTGRES_PASSWORD: password
    ports:
     - "5432:5432"

  redis:
    container_name: redis
    image: redis
    restart: always
    ports:
     - "6379:6379"
